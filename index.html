<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JobFlow — Application Command Center</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <main class="shell">
    <header><div><div class="brand"><span class="brand-mark">↗</span> JobFlow</div><p>Your application command center</p></div><button class="primary" id="addButton">+ Add application</button></header>
    <section class="hero"><div><p class="eyebrow">OCTOBER 2026</p><h1>Keep the next opportunity<br><em>moving forward.</em></h1><p class="hero-copy">A calm, focused view of every application, interview and follow-up.</p></div><div class="goal"><span>WEEKLY GOAL</span><strong><b id="goalCount">0</b> / 8</strong><div class="progress"><i id="progress"></i></div><small>Applications sent this week</small></div></section>
    <section class="stats" id="stats"></section>
    <section class="toolbar"><div class="search"><span>⌕</span><input id="search" placeholder="Search companies or roles"></div><div class="filters" id="filters"><button class="active" data-filter="All">All</button><button data-filter="Saved">Saved</button><button data-filter="Applied">Applied</button><button data-filter="Interview">Interview</button><button data-filter="Offer">Offer</button></div></section>
    <section class="content"><div class="section-title"><h2>Applications</h2><span id="resultCount"></span></div><div id="applications" class="cards"></div></section>
  </main>
  <dialog id="dialog"><form id="applicationForm"><div class="modal-head"><div><p class="eyebrow" id="modalLabel">NEW APPLICATION</p><h2 id="modalTitle">Add an application</h2></div><button type="button" class="icon-button" id="closeDialog">×</button></div><input type="hidden" id="applicationId"><div class="form-grid"><label>Company<input required id="company" placeholder="e.g. Acme Inc."></label><label>Role<input required id="role" placeholder="e.g. Product Engineer"></label><label>Location<input id="location" placeholder="Remote, Bengaluru…"></label><label>Status<select id="status"><option>Saved</option><option>Applied</option><option>Interview</option><option>Offer</option><option>Rejected</option></select></label><label>Date applied<input id="appliedAt" type="date"></label><label>Next step<input id="nextStep" placeholder="e.g. Follow up Friday"></label><label class="wide">Job link<input id="link" type="url" placeholder="https://"></label><label class="wide">Notes<textarea id="notes" rows="3" placeholder="Resume version, prep notes, referral details…"></textarea></label></div><div class="modal-actions"><button type="button" id="deleteButton" class="danger">Delete</button><span></span><button type="button" class="secondary" id="cancelButton">Cancel</button><button class="primary" id="saveButton">Save application</button></div></form></dialog><div id="toast"></div><script src="/app.js"></script>
</body></html>
